<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Lists Example</title>
</head>
<body>
    <h2>Unordered List</h2>
    <ul>
        <li>Item one</li>
        <li>Item two</li>
        <li>Item three</li>
    </ul>

    <h2>Ordered List</h2>
    <ol>
        <li>First</li>
        <li>Second</li>
    </ol>

    <h2>Definition List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
    </dl>
</body>
</html>
