<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Tables Example</title>
</head>
<body>
    <h2>Simple Table</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice</td>
                <td>24</td>
            </tr>
            <tr>
                <td>Bob</td>
                <td>29</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
